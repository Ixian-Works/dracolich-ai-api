spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: dracolich-ai-api
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  webflux:
    base-path: dracolich/ai/api/v0/
  mongodb:
    database: ${MONGODB_DATABASE}
    uri: ${MONGODB_URI}
    auto-index-creation: false

server:
  port: ${PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# Anthropic / Spring AI. Read by AnthropicProperties in dracolich-ai-core.
spring.ai:
  anthropic:
    api-key: ${ANTHROPIC_API_KEY}
    chat:
      # No default on purpose: each environment names its model, and a missing
      # value stops the service at startup. The Helm chart sets ANTHROPIC_MODEL.
      model: ${ANTHROPIC_MODEL}
      # Thinking counts toward this ceiling, as do the tool calls and the summary.
      max-tokens: ${ANTHROPIC_MAX_TOKENS:8192}
      # How much the model thinks and writes: low, medium, high, xhigh or max.
      # Start low and raise it only if the suggestions get worse.
      effort: ${ANTHROPIC_EFFORT:low}
      # Do not add temperature, top-p or top-k: current models reject them and
      # the service refuses to start when one is set.

# MTG Library API base URL (Phase 1 service) — Java code uses dracolich.* prefix
dracolich:
  mtg-library:
    api:
      base-url: ${DRACOLICH_MTG_LIBRARY_API_BASE_URL:http://localhost:8080/dracolich/mtg-library/api/v0}

management:
  server:
    port: 7980
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true